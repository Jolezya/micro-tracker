[build]
  command = "npm run build"
  publish = "dist"

# The app routes with BrowserRouter, so every path must fall back to index.html
# or a shared deep link (/listing/abc) 404s on first load.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Never cache the service worker, or testers get stuck on an old build.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
