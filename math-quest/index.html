<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Math Quest — 3D Adventure</title>
<style>
  :root{
    --bg:#0b1026; --panel:#141a3a; --panel2:#1c2450; --ink:#f4f7ff; --muted:#a8b2e0;
    --accent:#ffd24a; --accent2:#4ad3ff; --good:#37e39b; --bad:#ff6b6b; --purple:#a76bff;
    --radius:18px; --font-scale:1;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:'Baloo 2',system-ui,'Segoe UI',Roboto,Arial,sans-serif; font-size:calc(16px*var(--font-scale));
    -webkit-user-select:none; user-select:none; touch-action:none;}
  canvas{display:block;position:fixed;inset:0;}
  button{font-family:inherit;cursor:pointer;border:none;color:inherit;}
  .hidden{display:none !important;}
  .center{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;}

  /* ---------- overlay screens ---------- */
  .screen{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(1200px 800px at 50% -10%, #23306e 0%, #0b1026 60%);}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:2px solid #2c3670;
    border-radius:var(--radius);padding:22px;max-width:min(760px,92vw);width:100%;box-shadow:0 24px 60px rgba(0,0,0,.5);
    max-height:92vh;overflow:auto;}
  h1{font-size:2.6rem;margin:.1em 0;text-align:center;
    background:linear-gradient(90deg,var(--accent),var(--accent2),var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 4px 24px rgba(74,211,255,.25);}
  h2{margin:.2em 0 .6em;font-size:1.5rem;text-align:center}
  .sub{color:var(--muted);text-align:center;margin:0 0 16px}
  .btn{background:linear-gradient(180deg,#3a4aa0,#2a327a);border:2px solid #4b58c0;border-radius:14px;
    padding:14px 18px;font-size:1.05rem;font-weight:700;width:100%;margin:6px 0;transition:transform .08s, filter .1s;}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(180deg,#ffd24a,#ffb020);color:#3a2600;border-color:#ffe18a;}
  .btn.good{background:linear-gradient(180deg,#37e39b,#16b978);color:#053324;border-color:#7ff0c4;}
  .btn.ghost{background:#1a2150;border-color:#33407e;}
  .grid{display:grid;gap:10px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .tag{display:inline-flex;align-items:center;gap:6px;background:#0f1640;border:1px solid #2b3576;border-radius:999px;padding:6px 12px;font-weight:700}
  .muted{color:var(--muted)}

  /* ---------- character select ---------- */
  .charrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .charopt{background:#0f1640;border:2px solid #2b3576;border-radius:14px;padding:12px;text-align:center;transition:.12s}
  .charopt.sel{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,210,74,.25)}
  .charface{font-size:2.4rem}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;z-index:20;pointer-events:none;}
  .hudtop{position:absolute;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:8px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
  .stat{pointer-events:auto;background:rgba(16,22,54,.82);border:1.5px solid #2b3576;border-radius:12px;padding:7px 12px;font-weight:800;display:flex;align-items:center;gap:7px;backdrop-filter:blur(6px);font-size:.95rem}
  .xpwrap{min-width:150px;flex:1;max-width:280px}
  .xpbar{height:9px;background:#0c1132;border-radius:6px;overflow:hidden;margin-top:5px;border:1px solid #2b3576}
  .xpfill{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--purple));transition:width .35s}
  .streak{color:#ffb84a}
  .hudbtns{display:flex;gap:8px}
  .iconbtn{pointer-events:auto;width:44px;height:44px;border-radius:12px;background:rgba(16,22,54,.82);border:1.5px solid #2b3576;font-size:1.3rem;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px)}

  .toast{position:absolute;top:96px;left:50%;transform:translateX(-50%);background:rgba(16,22,54,.94);border:2px solid var(--accent);
    border-radius:14px;padding:10px 18px;font-weight:800;pointer-events:none;opacity:0;transition:opacity .3s, transform .3s;text-align:center}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .prompt{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);pointer-events:none;
    background:rgba(16,22,54,.92);border:2px solid var(--accent2);border-radius:14px;padding:10px 16px;font-weight:800;text-align:center;opacity:0;transition:.15s}
  .prompt.show{opacity:1}

  /* ---------- touch controls ---------- */
  #touch{position:fixed;inset:0;z-index:15;pointer-events:none}
  #joy{position:absolute;left:24px;bottom:calc(28px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;
    background:rgba(20,26,58,.5);border:2px solid #33407e;pointer-events:auto;touch-action:none}
  #knob{position:absolute;left:35px;top:35px;width:60px;height:60px;border-radius:50%;background:rgba(120,140,255,.85);border:2px solid #fff}
  #actionBtn{position:absolute;right:26px;bottom:calc(40px + env(safe-area-inset-bottom));width:96px;height:96px;border-radius:50%;
    background:linear-gradient(180deg,#ffd24a,#ffab12);color:#3a2600;border:3px solid #fff3c4;font-weight:900;font-size:1rem;pointer-events:auto;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.05;box-shadow:0 10px 24px rgba(0,0,0,.4)}
  #actionBtn:active{transform:scale(.94)}

  /* ---------- question modal ---------- */
  #qModal{z-index:60}
  .qcard{max-width:min(560px,94vw)}
  .qtype{font-size:.85rem;letter-spacing:.05em;text-transform:uppercase;color:var(--accent2);text-align:center;font-weight:800}
  .qtext{font-size:2rem;font-weight:800;text-align:center;margin:8px 0 4px}
  .qvisual{display:flex;justify-content:center;margin:6px 0}
  .choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .choice{background:#10164a;border:2px solid #33407e;border-radius:14px;padding:16px;font-size:1.35rem;font-weight:800;transition:.1s}
  .choice:active{transform:scale(.97)}
  .choice.correct{background:linear-gradient(180deg,#37e39b,#16b978);color:#053324;border-color:#7ff0c4;animation:pop .3s}
  .choice.wrong{background:linear-gradient(180deg,#ff6b6b,#d63d3d);color:#3a0000;border-color:#ffb3b3}
  @keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
  .hintbox{margin-top:12px;background:#161c46;border:1.5px dashed #4b58c0;border-radius:12px;padding:12px;color:#ffe7a8;text-align:center;font-weight:600}
  .enemybar{height:16px;background:#3a0f14;border-radius:8px;border:1px solid #6b1e26;overflow:hidden;margin:6px 0}
  .enemyfill{height:100%;background:linear-gradient(90deg,#ff8a5b,#ff5b7a);transition:width .3s}
  .fightscene{text-align:center;font-size:3rem;margin:4px 0}
  .shake{animation:shk .3s}
  @keyframes shk{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

  /* ---------- misc panels ---------- */
  .list{display:grid;gap:8px;margin-top:8px}
  .listitem{background:#10164a;border:1.5px solid #2b3576;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .locked{opacity:.55}
  .barfill-sm{height:8px;background:#0c1132;border-radius:5px;overflow:hidden;border:1px solid #2b3576;min-width:80px;flex:1}
  .barfill-sm > div{height:100%;background:linear-gradient(90deg,var(--good),var(--accent2))}
  .badgeitem{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#10164a;border:1.5px solid #2b3576;border-radius:14px;padding:8px;text-align:center;font-size:.75rem;gap:4px}
  .badgeitem .em{font-size:1.8rem}
  .toggle{display:flex;justify-content:space-between;align-items:center;background:#10164a;border:1.5px solid #2b3576;border-radius:12px;padding:12px}
  .switch{width:52px;height:30px;border-radius:16px;background:#33407e;position:relative;transition:.15s}
  .switch.on{background:var(--good)}
  .switch b{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.15s}
  .switch.on b{left:25px}
  input[type=range]{width:100%}
  .pin{font-size:2rem;letter-spacing:.4em;text-align:center;background:#10164a;border:2px solid #2b3576;border-radius:12px;padding:10px;color:var(--ink);width:100%}
  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  .keypad button{background:#10164a;border:1.5px solid #2b3576;border-radius:12px;padding:14px;font-size:1.3rem;font-weight:800}
  .close{position:absolute;top:10px;right:12px;font-size:1.4rem;background:transparent;color:var(--muted);width:40px;height:40px}
  .flash{position:fixed;inset:0;z-index:70;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,255,255,.5),transparent 60%)}
  .flash.go{animation:fl .5s}
  @keyframes fl{0%{opacity:.8}100%{opacity:0}}
  .small{font-size:.85rem}
  .kbd{background:#0c1132;border:1px solid #2b3576;border-radius:6px;padding:2px 7px;font-size:.85rem;font-weight:800}
  a{color:var(--accent2)}
  ::-webkit-scrollbar{width:8px}::-webkit-scrollbar-thumb{background:#2b3576;border-radius:8px}
</style>
<!-- Three.js is vendored locally in ./vendor so the game runs fully offline, no CDN needed. -->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>

<body>

<!-- Loading / offline fallback -->
<div id="loading" class="screen"><div class="card center" style="border:none;background:none;box-shadow:none">
  <h1>Math Quest</h1><p class="sub" id="loadmsg">Loading the adventure…</p>
</div></div>

<div id="app"></div>

<script type="module">
import * as THREE from 'three';
window.__mqLoaded = true;

/* =========================================================================
   MATH QUEST — a 3D educational adventure game
   Single-file build. Systems: adaptive math engine, 3D world with 5 zones,
   mini-games (battle, boss, treasure, race, daily), rewards, cosmetics,
   streaks, achievements, parent dashboard, settings & accessibility.
   ========================================================================= */

/* ----------------------------- Persistence ----------------------------- */
const SAVE_KEY = 'mathquest.save.v1';
function defaultProfile(){
  return {
    name:'Explorer', char:0, level:1, xp:0, coins:0, stars:0,
    badges:{}, owned:{c0:true}, equipped:{skin:'c0',hat:null,pet:null},
    difficultyTier:1,                    // 1 Explorer, 2 Challenger, 3 Master
    adaptive:{},                         // per-category difficulty 1..10
    stats:{},                            // per-category {seen,correct,timeMs}
    recentMistakes:[],
    unlocked:{forest:true},
    zoneProgress:{},                     // zoneId -> correctCount
    bosses:{},                           // zoneId -> defeated bool
    bestStreak:0,
    daily:{date:null, index:0, correct:0, bestScore:0, streak:0, done:false},
    settings:{music:true,sfx:true,voice:false,textScale:1,highContrast:false},
    parentPin:'1234',
    seenQuestions:[],
    totalCorrect:0, totalSeen:0,
  };
}
let P = load();
function load(){
  try{ const s=JSON.parse(localStorage.getItem(SAVE_KEY)); if(s&&s.settings) return Object.assign(defaultProfile(),s); }catch(e){}
  return defaultProfile();
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(P)); }catch(e){} }

/* ------------------------------- Audio -------------------------------- */
const Audio2 = (()=>{
  let ctx=null, musicNodes=[], musicOn=false, musicTimer=null, step=0;
  function ac(){ if(!ctx){ try{ctx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return ctx; }
  function tone(freq,dur=0.12,type='sine',vol=0.2,when=0){
    if(!P.settings.sfx) return; const c=ac(); if(!c) return;
    const o=c.createOscillator(),g=c.createGain(); o.type=type; o.frequency.value=freq;
    o.connect(g); g.connect(c.destination); const t=c.currentTime+when;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.start(t); o.stop(t+dur+0.02);
  }
  function seq(notes,type='triangle',vol=0.18){ let t=0; notes.forEach(n=>{ tone(n[0],n[1],type,vol,t); t+=n[1]; }); }
  const sfx={
    correct:()=>seq([[660,.09],[880,.12]],'triangle',.2),
    wrong:()=>seq([[240,.14],[180,.18]],'sawtooth',.14),
    coin:()=>seq([[988,.05],[1319,.08]],'square',.12),
    star:()=>seq([[784,.07],[988,.07],[1319,.12]],'triangle',.18),
    level:()=>seq([[523,.1],[659,.1],[784,.1],[1047,.22]],'triangle',.2),
    click:()=>tone(520,.05,'square',.09),
    unlock:()=>seq([[392,.12],[523,.12],[784,.2]],'triangle',.2),
    boss:()=>seq([[110,.2],[130,.2],[98,.3]],'sawtooth',.16),
    hit:()=>tone(160,.1,'square',.14),
    win:()=>seq([[523,.12],[659,.12],[784,.12],[1047,.14],[1319,.3]],'triangle',.22),
  };
  // gentle background music: arpeggio loop
  const scale=[261.63,293.66,329.63,392.0,440.0,523.25,587.33];
  const pattern=[0,2,4,6,4,2,0,4,2,5,4,2];
  function startMusic(){
    if(musicOn||!P.settings.music) return; const c=ac(); if(!c) return; musicOn=true; step=0;
    const tick=()=>{ if(!musicOn) return;
      const f=scale[pattern[step%pattern.length]]; tone(f,.28,'sine',.05);
      if(step%4===0) tone(f/2,.5,'triangle',.045);
      step++; musicTimer=setTimeout(tick,300); };
    tick();
  }
  function stopMusic(){ musicOn=false; if(musicTimer) clearTimeout(musicTimer); }
  function resume(){ const c=ac(); if(c&&c.state==='suspended') c.resume(); }
  return {sfx,startMusic,stopMusic,resume,
    refresh(){ if(P.settings.music) startMusic(); else stopMusic(); }};
})();

/* --------------------------- Speech (optional) ------------------------- */
function speak(t){ if(!P.settings.voice||!window.speechSynthesis) return;
  try{ const u=new SpeechSynthesisUtterance(t); u.rate=1; u.pitch=1.15; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} }

/* --------------------------- Math Engine ------------------------------ */
// Categories map to zones. Each generator takes difficulty 1..10.
const rint=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const gcd=(a,b)=>b?gcd(b,a%b):a;

function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function distractors(ans, spread=6, count=3, positive=true){
  const set=new Set([ans]); let guard=0;
  while(set.size<count+1 && guard++<60){
    let d=ans + rint(-spread,spread); if(d===ans) continue;
    if(positive && d<0) continue; set.add(d);
  }
  return shuffle([...set]);
}

// Each generator returns {q, ans, choices, hint, visual, category, difficulty}
const Gen = {
  addition(d){ const max=[10,20,40,80,150,300,600,1000,2000,5000][d-1]||1000;
    const a=rint(2,max),b=rint(2,max),ans=a+b;
    return {q:`${a} + ${b} = ?`, ans, choices:distractors(ans,Math.max(4,Math.round(max/10))), hint:`Add the ones first, then the tens. ${a} + ${b}.`}; },
  subtraction(d){ const max=[10,20,40,80,150,300,600,1000,2000,5000][d-1]||1000;
    let a=rint(3,max),b=rint(2,a),ans=a-b;
    return {q:`${a} − ${b} = ?`, ans, choices:distractors(ans,Math.max(4,Math.round(max/10))), hint:`Count up from ${b} to ${a}, or take away ${b}.`}; },
  multiplication(d){ const t=[5,6,7,9,10,12,12,20,25,40][d-1]||12; const t2=[5,6,8,9,10,12,15,20,30,60][d-1]||12;
    const a=rint(2,t),b=rint(2,t2),ans=a*b;
    return {q:`${a} × ${b} = ?`, ans, choices:distractors(ans,Math.max(6,a+b), 3), hint:`${a} × ${b} means ${b} added ${a} times. Try ${a}×${b-1} then add ${a}.`}; },
  division(d){ const t=[5,6,7,9,10,12,12,15,20,25][d-1]||12; const b=rint(2,t),ans=rint(2,t),a=b*ans;
    return {q:`${a} ÷ ${b} = ?`, ans, choices:distractors(ans,Math.max(3,Math.round(t/2))), hint:`How many groups of ${b} fit into ${a}? Think ${b} × ? = ${a}.`}; },
  mentalmath(d){ const m=[10,15,20,30,50,80,120,200,300,500][d-1]||50; const a=rint(2,m),b=rint(2,m),c=rint(1,Math.min(9,m));
    let op=pick(['+','-']); let ans= op==='+'? a+b+c : a+b-c; if(ans<0){ ans=a+b+c; op='+'; }
    return {q:`${a} + ${b} ${op} ${c} = ?`, ans, choices:distractors(ans,8), hint:`Do it step by step: ${a} + ${b}, then ${op} ${c}.`}; },
  patterns(d){ const start=rint(1,10*d), stepv=rint(2,2+d);
    const type=pick(['add','mul']); let seqArr=[],ans;
    if(type==='add'){ for(let i=0;i<4;i++) seqArr.push(start+stepv*i); ans=start+stepv*4;
      return {q:`Pattern: ${seqArr.join(', ')}, ?`, ans, choices:distractors(ans,stepv+3), hint:`Each number goes up by ${stepv}.`}; }
    else { const r=rint(2,3); let v=start; for(let i=0;i<3;i++){seqArr.push(v); v*=r;} ans=v;
      return {q:`Pattern: ${seqArr.join(', ')}, ?`, ans, choices:distractors(ans,Math.round(ans/2)), hint:`Each number is multiplied by ${r}.`}; } },
  missingnumber(d){ const max=[10,20,40,80,150,300,600,1000,2000,4000][d-1]||100;
    const a=rint(2,max),ans=rint(2,max),sum=a+ans;
    return {q:`${a} + ? = ${sum}`, ans, choices:distractors(ans,Math.max(4,Math.round(max/10))), hint:`? = ${sum} − ${a}.`}; },

  fractions(d){ // compare or add simple fractions or recognize
    const kind=pick(d<3?['recognize','compare']:['compare','addsub','recognize']);
    if(kind==='recognize'){ const den=pick([2,3,4,5,6,8]); const num=rint(1,den-1);
      return {q:`What fraction is shaded?`, ans:num, choices:shuffle([num,...new Set([Math.max(1,num-1),num+1,Math.min(den-1,num+ (num<den-1?2:-2))])].filter((v,i,a)=>a.indexOf(v)===i).slice(0,4)),
        visual:{type:'pie',num,den}, hint:`Count shaded parts out of ${den}. Answer is the top number (numerator).`, labelAns:`${'?'}` , display:v=>`${v}/${den}`, cmpKey:`${num}/${den}`}; }
    if(kind==='compare'){ const den=pick([3,4,6,8]); let n1=rint(1,den-1),n2=rint(1,den-1),g=0; while(n1===n2&&g++<50) n2=rint(1,den-1); if(n1===n2) n2=(n1%(den-1))+1;
      const bigger= n1>n2? `${n1}/${den}`:`${n2}/${den}`;
      const opts=shuffle([`${n1}/${den}`,`${n2}/${den}`]);
      return {q:`Which is bigger?`, ans:bigger, choices:opts, textChoice:true,
        visual:{type:'twopie',n1,n2,den}, hint:`Same bottom number, so the bigger top number is bigger.`}; }
    // addsub same denom
    const den=pick([4,5,6,8,10]); let n1=rint(1,den-1),n2=rint(1,den-1);
    if(n1+n2>=den) n2=Math.max(1,den-n1- (rint(0,1))); const ansN=n1+n2;
    return {q:`${n1}/${den} + ${n2}/${den} = ?`, ans:`${ansN}/${den}`, textChoice:true,
      choices:shuffle([`${ansN}/${den}`,`${ansN}/${den+2}`,`${ansN+1}/${den}`,`${Math.max(1,ansN-1)}/${den}`].filter((v,i,a)=>a.indexOf(v)===i).slice(0,4)),
      hint:`Bottom numbers match, so just add the tops: ${n1}+${n2}, keep ${den} on the bottom.`}; },

  decimals(d){ const kind=pick(['add','sub','compare','mul']);
    const r=()=> (rint(1, d<4?20:99)/10);
    if(kind==='compare'){ let a=r(),b=r(),g=0; while(a===b&&g++<50) b=r(); if(a===b) b=+(a+0.3).toFixed(1); const ans=(a>b?a:b).toFixed(1);
      return {q:`Which is bigger?`, ans:String(ans), textChoice:true, choices:shuffle([a.toFixed(1),b.toFixed(1)]),
        hint:`Compare the whole-number part first, then the tenths.`}; }
    if(kind==='mul'){ const a=r(), b=rint(2,5); const ans=+(a*b).toFixed(1);
      return {q:`${a.toFixed(1)} × ${b} = ?`, ans:String(ans), textChoice:true,
        choices:shuffle([...new Set([ans,+(ans+0.1).toFixed(1),+(ans-0.2).toFixed(1),+(a*(b+1)).toFixed(1)])].slice(0,4).map(String)),
        hint:`Multiply as if no dot (${Math.round(a*10)}×${b}), then put the dot back one place.`}; }
    const a=r(),b=r(); if(kind==='sub'&&b>a){ const t=a; /*ensure positive*/ }
    let x=a,y=b,ans; if(kind==='add'){ ans=+(a+b).toFixed(1); return {q:`${a.toFixed(1)} + ${b.toFixed(1)} = ?`, ans:String(ans), textChoice:true,
        choices:shuffle([...new Set([ans,+(ans+0.1).toFixed(1),+(ans-0.1).toFixed(1),+(ans+1).toFixed(1)])].slice(0,4).map(String)),
        hint:`Line up the dots, then add.`}; }
    if(y>x){[x,y]=[y,x];} ans=+(x-y).toFixed(1);
    return {q:`${x.toFixed(1)} − ${y.toFixed(1)} = ?`, ans:String(ans), textChoice:true,
      choices:shuffle([...new Set([ans,+(ans+0.1).toFixed(1),+(Math.abs(ans-0.2)).toFixed(1),+(ans+1).toFixed(1)])].slice(0,4).map(String)),
      hint:`Line up the dots, then subtract.`}; },

  shapes(d){ const list=[['triangle',3],['square',4],['pentagon',5],['hexagon',6],['octagon',8]];
    const askSides=Math.random()<.5;
    if(askSides){ const [name,sides]=pick(list);
      return {q:`How many sides does a ${name} have?`, ans:sides, choices:shuffle([...new Set([sides,sides+1,sides-1,sides+2])].slice(0,4)),
        visual:{type:'shape',name}, hint:`Look at the picture and count each straight edge.`}; }
    const [name,sides]=pick(list);
    return {q:`Which shape has ${sides} sides?`, ans:name, textChoice:true, choices:shuffle(list.map(s=>s[0])).slice(0,4).includes(name)?shuffle([name,...shuffle(list.map(s=>s[0]).filter(n=>n!==name)).slice(0,3)]):shuffle([name,...list.filter(s=>s[0]!==name).slice(0,3).map(s=>s[0])]),
      visual:{type:'shape',name}, hint:`Count the sides of each shape.`}; },
  angles(d){ const kind=pick(['name','sum']);
    if(kind==='name'){ const deg=pick([30,45,60,90,120,135,150,180]);
      const ans= deg<90?'acute': deg===90?'right': deg===180?'straight':'obtuse';
      return {q:`A ${deg}° angle is called…`, ans, textChoice:true, choices:shuffle(['acute','right','obtuse','straight']),
        visual:{type:'angle',deg}, hint:`Less than 90°=acute, exactly 90°=right, more than 90°=obtuse, 180°=straight.`}; }
    const a=pick([30,40,50,60,70,80]); const ans=90-a;
    return {q:`Two angles make a right angle (90°). One is ${a}°. The other?`, ans, choices:distractors(ans,10), hint:`Both add to 90°, so 90 − ${a}.`}; },
  perimeter(d){ const l=rint(2,4+d*2),w=rint(2,4+d*2),ans=2*(l+w);
    return {q:`Perimeter of a ${l}×${w} rectangle?`, ans, choices:distractors(ans,Math.max(6,l+w)), visual:{type:'rect',l,w,mode:'perim'},
      hint:`Perimeter = all sides added: ${l}+${w}+${l}+${w}.`}; },
  area(d){ const l=rint(2,4+d*2),w=rint(2,4+d*2),ans=l*w;
    return {q:`Area of a ${l}×${w} rectangle?`, ans, choices:distractors(ans,Math.max(6,l*2)), visual:{type:'rect',l,w,mode:'area'},
      hint:`Area = length × width = ${l} × ${w}.`}; },
  volume(d){ const a=rint(2,3+d),b=rint(2,3+d),c=rint(2,3+d),ans=a*b*c;
    return {q:`Volume of a ${a}×${b}×${c} box?`, ans, choices:distractors(ans,Math.max(8,ans>50?ans/3:10)), visual:{type:'box3d',a,b,c},
      hint:`Volume = length × width × height = ${a}×${b}×${c}.`}; },
  symmetry(d){ const shapes=[['A',1],['H',2],['O',4],['E',1],['X',2],['T',1],['S',0],['B',1]];
    const [ch,lines]=pick(shapes);
    return {q:`How many lines of symmetry does the letter "${ch}" have?`, ans:lines, choices:shuffle([...new Set([lines,lines+1,Math.max(0,lines-1),lines+2])].slice(0,4)),
      visual:{type:'letter',ch}, hint:`A line of symmetry folds the shape so both halves match exactly.`}; },

  money(d){ const price=rint(3, 5+d*4)+ (Math.random()<.5?0.5:0); const paid=Math.ceil(price)+rint(1,5+d);
    const ans=+(paid-price).toFixed(2);
    return {q:`A toy costs $${price.toFixed(2)}. You pay $${paid}. Change?`, ans:String(ans), textChoice:true,
      choices:shuffle([...new Set([ans, +(ans+1).toFixed(2), +(ans-0.5).toFixed(2), +(ans+0.5).toFixed(2)])].filter(v=>v>=0).slice(0,4).map(v=>v.toFixed(2))),
      hint:`Change = money paid − price = ${paid} − ${price.toFixed(2)}.`}; },
  time(d){ const h=rint(1,6), m=pick([15,20,30,40,45]); const startH=rint(1,9), startM=pick([0,15,30]);
    let tot=startH*60+startM + h*60+m; let eh=Math.floor(tot/60)%12; if(eh===0) eh=12; let em=tot%60;
    const ans=`${eh}:${String(em).padStart(2,'0')}`;
    return {q:`It's ${startH}:${String(startM).padStart(2,'0')}. What time is it ${h}h ${m}min later?`, ans, textChoice:true,
      choices:shuffle([...new Set([ans, `${eh}:${String((em+15)%60).padStart(2,'0')}`, `${(eh%12)+1}:${String(em).padStart(2,'0')}`, `${eh}:${String((em+45)%60).padStart(2,'0')}`])].slice(0,4)),
      hint:`Add the hours first, then the minutes. Watch for going past 60 minutes.`}; },
  distance(d){ const speed=rint(3,6+d), time=rint(2,5+d), ans=speed*time;
    return {q:`A car goes ${speed} km/h for ${time} hours. Distance?`, ans, choices:distractors(ans,Math.max(6,speed)), hint:`Distance = speed × time = ${speed} × ${time}.`}; },
  speed(d){ const speed=rint(4,8+d), time=rint(2,5), dist=speed*time;
    return {q:`You travel ${dist} km in ${time} hours. Speed (km/h)?`, ans:speed, choices:distractors(speed,5), hint:`Speed = distance ÷ time = ${dist} ÷ ${time}.`}; },
  measurement(d){ const kind=pick(['m2cm','kg2g','l2ml']);
    if(kind==='m2cm'){ const m=rint(1,5+d),ans=m*100; return {q:`${m} metres = ? centimetres`, ans, choices:distractors(ans,60,3,true), hint:`1 metre = 100 cm, so ${m}×100.`}; }
    if(kind==='kg2g'){ const kg=rint(1,5+d),ans=kg*1000; return {q:`${kg} kg = ? grams`, ans, choices:distractors(ans,400,3,true), hint:`1 kg = 1000 g.`}; }
    const l=rint(1,5+d),ans=l*1000; return {q:`${l} litres = ? millilitres`, ans, choices:distractors(ans,400,3,true), hint:`1 litre = 1000 ml.`}; },
  wordproblem(d){ const kinds=['groups','share','total','left'];
    const k=pick(kinds); const a=rint(3,5+d*2), b=rint(2,4+d);
    if(k==='groups'){ const ans=a*b; return {q:`There are ${a} baskets with ${b} apples each. How many apples?`, ans, choices:distractors(ans,a+b), hint:`${a} groups of ${b} → ${a} × ${b}.`}; }
    if(k==='share'){ const total=a*b, ans=b; return {q:`${total} candies shared equally among ${a} friends. Each gets?`, ans, choices:distractors(ans,4), hint:`Share equally → ${total} ÷ ${a}.`}; }
    if(k==='total'){ const c=rint(2,6); const ans=a+b+c; return {q:`Sam read ${a} pages, then ${b}, then ${c}. Total pages?`, ans, choices:distractors(ans,6), hint:`Add them all: ${a}+${b}+${c}.`}; }
    const spent=rint(2,a); const ans=a-spent; return {q:`You had ${a} coins and spent ${spent}. How many left?`, ans, choices:distractors(ans,4), hint:`Take away: ${a} − ${spent}.`}; },
  logic(d){ const kind=pick(['odd','even','next','double']);
    if(kind==='double'){ const a=rint(3,6+d*3); const ans=a*2; return {q:`I think of a number, double it, and get ${ans*1}. Wait — double ${a} is ?`, ans, choices:distractors(ans,6), hint:`Double means × 2.`}; }
    if(kind==='next'){ const s=rint(1,20),step=rint(2,4); const arr=[s,s+step,s+2*step]; const ans=s+3*step;
      return {q:`Odd one out — find the next: ${arr.join(', ')}, ?`, ans, choices:distractors(ans,step+2), hint:`The jump each time is ${step}.`}; }
    const n=rint(10,40+d*10); const ans=(n%2===0)?'even':'odd';
    return {q:`Is ${n} odd or even?`, ans, textChoice:true, choices:shuffle(['odd','even']), hint:`Even numbers end in 0,2,4,6,8.`}; },
};

// Adaptive difficulty per category
function getDiff(cat){ let base=P.adaptive[cat]; if(base==null){ base=1.5+ (P.difficultyTier-1)*2; P.adaptive[cat]=base; }
  const floor=1+(P.difficultyTier-1)*1.5; base=Math.max(base,floor);
  return Math.min(10, Math.max(1, Math.round(base))); }
function adapt(cat, correct, ms){
  let v=P.adaptive[cat]??2;
  if(correct){ v += ms<6000?0.6:0.3; } else { v -= 0.7; }
  P.adaptive[cat]=Math.min(10,Math.max(1,v));
  // stats
  const s=P.stats[cat]||(P.stats[cat]={seen:0,correct:0,timeMs:0});
  s.seen++; if(correct)s.correct++; s.timeMs+=ms;
  P.totalSeen++; if(correct)P.totalCorrect++;
}
function makeQuestion(cat){
  const d=getDiff(cat); let q,guard=0;
  do{ q=Gen[cat](d); guard++; } while(guard<8 && P.seenQuestions.includes(cat+'|'+q.q));
  P.seenQuestions.push(cat+'|'+q.q); if(P.seenQuestions.length>40) P.seenQuestions.shift();
  q.category=cat; q.difficulty=d; if(!q.choices||!q.choices.length){ q.choices=[q.ans]; }
  // normalize choices to strings for comparison, ensure answer present
  q.choices=q.choices.map(String);
  const ansStr=String(q.ans);
  if(!q.choices.includes(ansStr)){ q.choices[q.choices.length-1]=ansStr; }
  q.choices=shuffle([...new Set(q.choices)]);
  // Ensure enough options. Text-answer questions (compare/name) keep their own
  // options — don't invent numeric junk like "2" for "which fraction is bigger?".
  const minChoices = q.textChoice ? 2 : 3;
  let padGuard=0;
  while(q.choices.length<minChoices && !q.textChoice && padGuard++<10){
    const cand=String((+ansStr||0)+padGuard+1);
    if(!q.choices.includes(cand)) q.choices.push(cand);
  }
  q.ansStr=ansStr;
  return q;
}

/* visual builder for question visuals */
function buildVisual(v){
  const wrap=el('div','qvisual');
  if(!v){ return wrap; }
  if(v.type==='pie'||v.type==='twopie'){
    const one=(num,den)=>{ const deg=360*num/den; const c=el('div'); c.style.cssText=`width:110px;height:110px;border-radius:50%;border:3px solid #fff;background:conic-gradient(var(--accent2) 0 ${deg}deg,#1a2150 ${deg}deg 360deg)`;
      const lbl=el('div','muted small',`${num}/${den}`); lbl.style.textAlign='center'; const box=el('div'); box.append(c,lbl); box.style.margin='0 8px'; return box; };
    if(v.type==='pie') wrap.append(one(v.num,v.den));
    else { wrap.style.gap='10px'; wrap.append(one(v.n1,v.den),one(v.n2,v.den)); }
  } else if(v.type==='shape'){
    const map={triangle:'M55 8 L100 96 L10 96 Z',square:'M15 15 H95 V95 H15 Z',
      pentagon:'M55 8 L100 42 L82 98 L28 98 L10 42 Z',hexagon:'M30 12 H80 L100 55 L80 98 H30 L10 55 Z',
      octagon:'M35 10 H75 L100 35 V75 L75 100 H35 L10 75 V35 Z'};
    wrap.innerHTML=`<svg width="120" height="120" viewBox="0 0 110 110"><path d="${map[v.name]||map.square}" fill="#4ad3ff" stroke="#fff" stroke-width="3"/></svg>`;
  } else if(v.type==='angle'){
    const r=48,rad=v.deg*Math.PI/180, x=55+r*Math.cos(-rad), y=60-r*Math.sin(rad);
    wrap.innerHTML=`<svg width="150" height="120" viewBox="0 0 150 120"><line x1="55" y1="60" x2="120" y2="60" stroke="#fff" stroke-width="4"/><line x1="55" y1="60" x2="${x}" y2="${y}" stroke="#ffd24a" stroke-width="4"/><text x="70" y="52" fill="#a8b2e0" font-size="12">${v.deg}°</text></svg>`;
  } else if(v.type==='rect'){
    const scale=Math.min(12,120/Math.max(v.l,v.w)); const w=v.l*scale, h=v.w*scale;
    wrap.innerHTML=`<svg width="${w+40}" height="${h+40}" viewBox="0 0 ${w+40} ${h+40}"><rect x="20" y="20" width="${w}" height="${h}" fill="#2a3a8a" stroke="#4ad3ff" stroke-width="3"/><text x="${20+w/2}" y="14" fill="#a8b2e0" font-size="12" text-anchor="middle">${v.l}</text><text x="10" y="${20+h/2}" fill="#a8b2e0" font-size="12" text-anchor="middle">${v.w}</text></svg>`;
  } else if(v.type==='box3d'){
    wrap.innerHTML=`<svg width="150" height="130" viewBox="0 0 150 130"><g stroke="#fff" stroke-width="2" fill="#2a3a8a"><polygon points="30,50 90,50 90,110 30,110" fill="#37507a"/><polygon points="30,50 55,25 115,25 90,50" fill="#4a6bb0"/><polygon points="90,50 115,25 115,85 90,110" fill="#2a3a6a"/></g><text x="60" y="128" fill="#a8b2e0" font-size="11" text-anchor="middle">${v.a}×${v.b}×${v.c}</text></svg>`;
  } else if(v.type==='letter'){
    wrap.innerHTML=`<div style="font-size:4rem;font-weight:900;color:#ffd24a;width:100px;text-align:center">${v.ch}</div>`;
  }
  return wrap;
}

function labelSprite(text,color='#ffffff',scale=4){

  g.strokeStyle=color; g.lineWidth=4; roundRect(g,16,74,480,110,26); g.stroke();
  g.fillStyle=color; g.fillText(text,256,132);
  const tex=new THREE.CanvasTexture(c); tex.anisotropy=4;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));
  sp.scale.set(scale,scale/2,1); return sp;
}
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

/* ---------------------------- movement + loop ------------------------- */
let moveVec=new THREE.Vector2(0,0); // from joystick
let nearObj=null;
const SPEED=9;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  updateMovement(dt);
  // spin crystals & bob
  const t=performance.now()/1000;
  for(const o of worldObjects){ if(o.type==='challenge'&&o.mesh.userData.spin){ o.mesh.userData.spin.rotation.y+=dt*1.5; o.mesh.userData.spin.position.y=1.6+Math.sin(t*2+o.mesh.position.x)*0.2; }
    if(o.mesh.userData.body&&(o.type==='battle'||o.type==='boss')) o.mesh.userData.body.position.y=(o.type==='boss'?1.7:1)+Math.sin(t*1.5)*0.15; }
  if(player&&player.userData.pet){ player.userData.pet.position.set(Math.cos(t*2)*1.2,0.6+Math.sin(t*4)*0.1,Math.sin(t*2)*1.2); }
  detectNearest();
  updateCamera(dt);
  renderer.render(scene,camera);
}
function updateMovement(dt){
  if(modalOpen||!player) return;
  let ix=0,iz=0;
  if(keys['w']||keys['arrowup'])iz-=1; if(keys['s']||keys['arrowdown'])iz+=1;
  if(keys['a']||keys['arrowleft'])ix-=1; if(keys['d']||keys['arrowright'])ix+=1;
  ix+=moveVec.x; iz+=moveVec.y;
  const len=Math.hypot(ix,iz);
  if(len>0.05){ ix/=Math.max(1,len); iz/=Math.max(1,len);
    player.position.x+=ix*SPEED*dt; player.position.z+=iz*SPEED*dt;
    // keep on the island world radius
    const r=Math.hypot(player.position.x,player.position.z+15);
    const target=Math.atan2(ix,iz);
    player.rotation.y += shortAngle(player.rotation.y,target)*Math.min(1,dt*12);
    // little bob
    if(player.userData.body) player.userData.body.position.y=1+Math.abs(Math.sin(performance.now()/120))*0.06;
    camYaw = target;
  }
  // clamp to big circle
  const maxR=95; const pr=Math.hypot(player.position.x,player.position.z);
  if(pr>maxR){ player.position.x*=maxR/pr; player.position.z*=maxR/pr; }
}
function shortAngle(a,b){ let d=(b-a)%(Math.PI*2); if(d>Math.PI)d-=Math.PI*2; if(d<-Math.PI)d+=Math.PI*2; return d; }
function updateCamera(dt){
  if(!player) return;
  const back=new THREE.Vector3(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y));
  const desired=player.position.clone().add(new THREE.Vector3(-back.x*11,8,-back.z*11));
  camera.position.lerp(desired,Math.min(1,dt*4));
  camera.lookAt(player.position.x,1.5,player.position.z);
}
function detectNearest(){
  if(!player){ return; }
  let best=null,bd=4.2;
  for(const o of worldObjects){ if(!o.active) continue;
    const d=o.mesh.position.distanceTo(player.position);
    if(d<bd){ bd=d; best=o; }
  }
  if(best!==nearObj){ nearObj=best; updatePrompt(); }
}
function updatePrompt(){
  const pr=$('#prompt'); if(!pr||!actionBtn) return;
  if(!nearObj){ pr.classList.remove('show'); actionBtn.textContent='—'; return; }
  const map={challenge:'Solve Challenge',chest:'Open Chest',battle:'Math Battle!',boss:'Fight BOSS',race:'Math Race',lock:'Locked Area'};
  let txt=map[nearObj.type]||'Interact';
  if(nearObj.type==='lock'){ const req=nearObj.data.req; txt = P.stars>=req? `Enter (press ${isTouch?'ACT':'E'})` : `Need ${req}⭐ (have ${P.stars})`; }
  pr.innerHTML=`${nearObj.type==='lock'?'🔒':'✨'} ${txt} &nbsp; <span class="kbd">${isTouch?'ACT':'E'}</span>`;
  pr.classList.add('show');
  actionBtn.textContent = map[nearObj.type]||'ACT';
}
function interact(){
  Audio2.resume();
  if(!nearObj||modalOpen) return;
  const o=nearObj;
  if(o.type==='challenge') openChallenge(o);
  else if(o.type==='chest') openChest(o);
  else if(o.type==='battle') startBattle(o.zone);
  else if(o.type==='boss') { if(o.data.done){ toast('Boss already defeated! 🏆'); } else startBoss(o.zone,o); }
  else if(o.type==='race') startRace(o.zone);
  else if(o.type==='lock') tryUnlock(o);
}

/* ============================ Rewards ================================= */
function xpForLevel(lv){ return 50+lv*40; }
function addXP(n){ P.xp+=n; let leveled=false;
  while(P.xp>=xpForLevel(P.level)){ P.xp-=xpForLevel(P.level); P.level++; leveled=true; }
  if(leveled){ Audio2.sfx.level(); flash(); toast(`⭐ LEVEL UP! You're level ${P.level}!`); speak(`Level ${P.level}!`); P.coins+=P.level*5; }
  updateHUD();
}
function addCoins(n){ P.coins+=n; Audio2.sfx.coin(); updateHUD(); }
function addStars(n){ P.stars+=n; Audio2.sfx.star(); updateHUD(); checkUnlocks(); }
function grantBadge(id,name,emoji){ if(P.badges[id])return; P.badges[id]={name,emoji,date:Date.now()}; toast(`🏅 Badge earned: ${name}!`); Audio2.sfx.win(); }
function checkAchievements(){
  if(P.totalCorrect>=1) grantBadge('first','First Steps','👣');
  if(P.totalCorrect>=25) grantBadge('sharp','Sharp Mind','🧠');
  if(P.totalCorrect>=100) grantBadge('genius','Math Genius','🎓');
  if(P.bestStreak>=5) grantBadge('streak5','On Fire','🔥');
  if(P.bestStreak>=10) grantBadge('streak10','Unstoppable','⚡');
  if(P.level>=5) grantBadge('lv5','Rising Star','🌟');
  const bossCount=Object.values(P.bosses).filter(Boolean).length;
  if(bossCount>=1) grantBadge('boss1','Boss Slayer','⚔️');
  if(bossCount>=5) grantBadge('bossAll','World Champion','👑');
  if(Object.keys(P.unlocked).length>=5) grantBadge('explorer','Grand Explorer','🗺️');
}
let streak=0;
function onCorrect(cat,ms,rewardMult=1){
  streak++; P.bestStreak=Math.max(P.bestStreak,streak);
  adapt(cat,true,ms);
  let coinBonus=0, xpBonus=0;
  if(streak===3){ toast('🔥 Streak x3! +5 bonus'); coinBonus+=5; }
  if(streak===5){ toast('🔥🔥 Streak x5! +15 bonus & ⭐'); coinBonus+=15; addStars(1); }
  if(streak===10){ toast('🔥🔥🔥 MEGA STREAK! +50 bonus & ⭐⭐'); coinBonus+=50; addStars(2); }
  const base=6+ (Gen[cat]?0:0);
  addCoins(Math.round((5+streak)*rewardMult)+coinBonus);
  addXP(Math.round((10+streak*2)*rewardMult)+xpBonus);
  // zone mission: every 5 correct in a zone grants a star
  checkAchievements(); updateStreakHUD(); save();
}
function onWrong(cat,ms){
  streak=0; adapt(cat,false,ms);
  updateStreakHUD();
}
function checkUnlocks(){
  let changed=false;
  ZONES.forEach(z=>{ if(!P.unlocked[z.id] && P.stars>=z.req){ /* becomes enterable, actual unlock on entering barrier */ } });
  save();
}

function setupJoystick(){
  const joy=$('#joy'),knob=$('#knob'); if(!joy)return; let active=false,cx=0,cy=0;
  const start=e=>{active=true; const r=joy.getBoundingClientRect(); cx=r.left+r.width/2; cy=r.top+r.height/2; move(e);};
  const move=e=>{ if(!active)return; const t=e.touches?e.touches[0]:e; let dx=t.clientX-cx,dy=t.clientY-cy; const d=Math.hypot(dx,dy),max=45;
    if(d>max){dx*=max/d;dy*=max/d;} knob.style.left=(35+dx)+'px'; knob.style.top=(35+dy)+'px'; moveVec.set(dx/max,dy/max); };
  const end=()=>{active=false; knob.style.left='35px'; knob.style.top='35px'; moveVec.set(0,0);};
  joy.addEventListener('touchstart',start,{passive:true}); joy.addEventListener('touchmove',move,{passive:true}); joy.addEventListener('touchend',end);
  joy.addEventListener('mousedown',start); addEventListener('mousemove',move); addEventListener('mouseup',end);
}

/* ---- generic single question asker ---- */
function askQuestion(cat,{title,onDone,noStreakReward,practice}={}){
  const t0=performance.now(); let attempts=0, answered=false;
  const q=makeQuestion(cat);
  const scr=modal((card,close)=>{
    card.appendChild(el('div','qtype', (title||catLabel[cat])+` · Lvl ${q.difficulty}`));
    card.appendChild(el('div','qtext', q.q));

    const hintBox=el('div','hintbox'); hintBox.style.display='none'; hintBox.textContent='';
    const choices=el('div','choices');
    q.choices.forEach(ch=>{ const b=choiceBtn(ch,q);
      b.onclick=()=>{ if(answered)return; Audio2.resume();
        if(ch===q.ansStr){ answered=true; b.classList.add('correct'); Audio2.sfx.correct(); speak('Correct!');
          const ms=performance.now()-t0;
          if(!practice){ onCorrect(cat,ms); } else { adapt(cat,true,ms); save(); }
          setTimeout(()=>{ close(); onDone&&onDone(true); },700);
        } else { attempts++; b.classList.add('wrong'); card.classList.add('shake'); setTimeout(()=>card.classList.remove('shake'),300);
          Audio2.sfx.wrong(); b.disabled=true;
          hintBox.style.display='block'; hintBox.innerHTML=`💡 <b>Hint:</b> ${q.hint}`; speak('Try again');
          if(!practice && attempts===1){ onWrong(cat,performance.now()-t0); recordMistake(q); }
          if(attempts>=2){ // reveal answer help
            hintBox.innerHTML=`💡 ${q.hint}<br><span class="small muted">The answer is <b>${q.display?q.display(q.ansStr):q.ansStr}</b>. Tap it to continue.</span>`;
          }
        }
      };
      choices.appendChild(b);
    });
    card.appendChild(choices);
    card.appendChild(hintBox);
  },{qcard:true,z:60,closable:!!practice,onClose:()=>{ onDone&&onDone(false); }});
}

        P.bosses[zoneId]=true; addStars(3); addCoins(80); addXP(120); grantBadge('boss1','Boss Slayer','⚔️'); Audio2.sfx.win(); flash(); checkAchievements();
        if(obj){ obj.data.done=true; } refreshWorldBoss(zoneId); save(); setTimeout(close,2200); return; }
      const cat=pick(z.cats); const dPrev=P.adaptive[cat]; P.adaptive[cat]=Math.min(10,(P.adaptive[cat]??3)+qn*0.4); // ramps up
      const q=makeQuestion(cat); P.adaptive[cat]=dPrev; const t0=performance.now(); qn++;
      holder.innerHTML=''; holder.appendChild(el('div','small muted',`Question ${qn} · Level ${q.difficulty}`)); holder.appendChild(el('div','qtext',q.q)); holder.appendChild(buildVisual(q.visual));
      const ch=el('div','choices');
      q.choices.forEach(c=>{ const b=choiceBtn(c,q);
        b.onclick=()=>{ Audio2.resume(); if(b.disabled)return;
          if(c===q.ansStr){ b.classList.add('correct'); Audio2.sfx.hit(); hp=Math.max(0,hp-Math.ceil(100/totalQ)); fill.style.width=hp+'%'; scene.textContent='⚡'; onCorrect(cat,performance.now()-t0,1.5); setTimeout(round,650); }
          else { b.classList.add('wrong'); b.disabled=true; Audio2.sfx.wrong(); card.classList.add('shake'); setTimeout(()=>card.classList.remove('shake'),300); onWrong(cat,performance.now()-t0); recordMistake(q); const hb=el('div','hintbox'); hb.innerHTML='💡 '+q.hint; holder.appendChild(hb); }
        }; ch.appendChild(b);
      });

    round();

function refreshWorldBoss(zoneId){
  const o=worldObjects.find(w=>w.type==='boss'&&w.zone===zoneId); if(!o)return;
  // recolor + label handled simply by scaling color
  o.mesh.traverse(m=>{ if(m.material&&m.material.color&&m.geometry&&m.geometry.type==='SphereGeometry'&&m.geometry.parameters.radius>1) m.material.color.set(0x66cc88); });
}

/* ---- Math Race ---- */
function startRace(zoneId){
  const z=zoneById(zoneId); let pos=0, opp=0, cp=0; const track=6;
  modal((card,close)=>{
    card.appendChild(el('div','qtype','🏎️ Math Race'));
    const laneP=el('div'); laneP.style.cssText='position:relative;height:32px;background:#10164a;border-radius:16px;margin:4px 0;border:1px solid #2b3576';
    const carP=el('div','',' 🏎️'); carP.style.cssText='position:absolute;left:0;top:2px;transition:left .4s;font-size:1.4rem'; laneP.appendChild(carP);
    const laneO=el('div'); laneO.style.cssText='position:relative;height:32px;background:#2a1030;border-radius:16px;margin:4px 0;border:1px solid #6b1e4e';
    const carO=el('div','','👻'); carO.style.cssText='position:absolute;left:0;top:2px;transition:left .4s;font-size:1.4rem'; laneO.appendChild(carO);
    card.append(el('div','small muted','You'),laneP,el('div','small muted','Rival'),laneO);
    const holder=el('div'); card.appendChild(holder);
    function draw(){ carP.style.left=(pos/track*90)+'%'; carO.style.left=(opp/track*90)+'%'; }
    function round(){
      draw();
      if(pos>=track){ holder.innerHTML='<h2>🏁 You win the race! 🎉</h2>'; const r=25+P.level*3; addCoins(r); addXP(35); addStars(1); toast(`🏎️ +${r}🪙 +1⭐`); Audio2.sfx.win(); flash(); save(); setTimeout(close,1600); return; }
      if(opp>=track){ holder.innerHTML='<h2>The rival won — rematch soon!</h2>'; setTimeout(close,1500); return; }
      const cat=pick(z.cats); const q=makeQuestion(cat); const t0=performance.now();
      holder.innerHTML=''; holder.appendChild(el('div','small muted',`Checkpoint ${pos+1}/${track}`)); holder.appendChild(el('div','qtext',q.q)); holder.appendChild(buildVisual(q.visual));
      const ch=el('div','choices');
      q.choices.forEach(c=>{ const b=choiceBtn(c,q);
        b.onclick=()=>{ Audio2.resume(); if(b.disabled)return;
          const fast=(performance.now()-t0)<5000;
          if(c===q.ansStr){ b.classList.add('correct'); Audio2.sfx.coin(); pos+= fast?2:1; opp+=1; onCorrect(cat,performance.now()-t0,1); setTimeout(round,500); }
          else { b.classList.add('wrong'); b.disabled=true; Audio2.sfx.wrong(); opp+=1; onWrong(cat,performance.now()-t0); recordMistake(q); const hb=el('div','hintbox'); hb.innerHTML='💡 '+q.hint; holder.appendChild(hb); setTimeout(()=>{},0); }
        }; ch.appendChild(b);
      });
      holder.appendChild(ch);
    }
    round();
  },{qcard:true,z:60});
}

/* ---- Daily Challenge ---- */
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function openDaily(){
  const today=todayStr();
  if(P.daily.date!==today){ P.daily={date:today,index:0,correct:0,bestScore:P.daily.bestScore||0,streak:0,done:false}; save(); }
  if(P.daily.done){ modal((card,close)=>{ card.appendChild(el('h2',null,'📅 Daily Challenge')); card.appendChild(el('p','sub','You finished today! 🎉'));
    card.appendChild(el('div','tag',`Best score: ${P.daily.bestScore}/10`)); card.appendChild(el('p','muted small','Come back tomorrow for a new set!')); }); return; }
  runDaily();
}
function runDaily(){
  const total=10; const allCats=ZONES.flatMap(z=>z.cats);
  const i=P.daily.index;
  if(i>=total){ P.daily.done=true; P.daily.bestScore=Math.max(P.daily.bestScore,P.daily.correct);
    const xp=P.daily.correct*15+30; addXP(xp); addCoins(P.daily.correct*8); if(P.daily.correct>=8)addStars(2);
    save();
    modal((card,close)=>{ card.appendChild(el('h2',null,'📅 Daily Complete!'));
      card.appendChild(el('div','tag',`Score: ${P.daily.correct}/${total}`));
      const acc=Math.round(100*P.daily.correct/total);
      card.appendChild(el('p','sub',`Accuracy ${acc}% · Best streak 🔥${P.daily.streak} · +${xp}XP`));
      card.appendChild(el('p','muted small',`Personal best: ${P.daily.bestScore}/${total}`));
      Audio2.sfx.win(); flash();
    }); return; }
  // difficulty ramps with index
  const cat=allCats[(i*3+P.daily.correct)%allCats.length];
  const prev=P.adaptive[cat]; P.adaptive[cat]=Math.min(10,(P.adaptive[cat]??2)+i*0.5);
  askQuestion(cat,{title:`📅 Daily · ${i+1}/${total}`, practice:false, onDone:(ok)=>{ P.adaptive[cat]=prev;
    P.daily.index++; if(ok){ P.daily.correct++; P.daily.streak=Math.max(P.daily.streak,streak);} save(); setTimeout(runDaily,300);
  }});
  // restore adaptive next tick handled in onDone
}

  const row=el('div','charrow');
  CHARS.forEach(([em,nm],i)=>{ const o=el('div','charopt'+(P.char===i?' sel':''),`<div class="charface">${em}</div><div class="small">${nm}</div>`);
    o.onclick=()=>{ P.char=i; Audio2.sfx.click(); row.querySelectorAll('.charopt').forEach(x=>x.classList.remove('sel')); o.classList.add('sel'); }; row.appendChild(o); });
  card.appendChild(row);
  card.appendChild(el('div','small muted','Your name:')); card.appendChild(nameIn);
  const diff=el('div','grid g3'); diff.style.marginTop='10px';
  [['1','Explorer','Ages 8-10'],['2','Challenger','Harder'],['3','Master','Expert']].forEach(([v,n,d])=>{ const b=el('button','btn '+(P.difficultyTier==+v?'primary':'ghost'),`${n}<br><span class="small muted">${d}</span>`);
    b.onclick=()=>{ P.difficultyTier=+v; diff.querySelectorAll('.btn').forEach(x=>x.classList.replace('primary','ghost')); b.classList.replace('ghost','primary'); Audio2.sfx.click(); }; diff.appendChild(b); });
  card.appendChild(el('div','small muted','Difficulty:')); card.appendChild(diff);
  const play=el('button','btn primary','▶ Start Adventure'); play.style.marginTop='14px';
  play.onclick=()=>{ Audio2.resume(); if(P.settings.music)Audio2.startMusic(); P.name=nameIn.value.trim()||CHARS[P.char][1]+' Hero'; save(); scr.remove(); startGame(); };
  card.appendChild(play);
  const cont=el('button','btn ghost', (P.totalSeen>0?'↩ Continue saved game':'')); if(P.totalSeen>0){ cont.onclick=()=>{ scr.remove(); startGame(); }; card.appendChild(cont);}
  card.appendChild(el('p','muted small','Controls: WASD/Arrows or joystick to move · E or ACT to interact · M for menu'));
  scr.appendChild(card); app.appendChild(scr);
}

titleScreen();

// expose a few for debugging / automated QA
window.MQ={P,save,startBoss,addStars};
if(window.__MQTEST){ window.MQ.makeQuestion=makeQuestion; window.MQ.cats=Object.keys(catLabel); window.MQ.Gen=Gen;
  window.MQ.worldObjects=worldObjects; window.MQ.tryUnlock=tryUnlock; }
</script>
